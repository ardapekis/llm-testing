<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Prediction-assisted evaluation workflow</title>
  <desc id="desc">Historical responses train a predictor, followed by sentinels, an adaptive batch, a randomized audit, and corrected ranking.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#59706a"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#f4f8f6"/>
  <text x="60" y="54" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#13211d">A statistically protected adaptive workflow</text>
  <text x="60" y="82" font-family="Inter,Arial,sans-serif" font-size="15" fill="#59706a">Early rounds learn; the final randomized audit protects the benchmark score.</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(42 126)">
      <rect width="190" height="150" rx="18" fill="#ffffff" stroke="#cbdad5"/>
      <circle cx="28" cy="28" r="15" fill="#dbeafe"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">1</text>
      <text x="22" y="72" font-size="19" font-weight="700" fill="#13211d">Historical data</text>
      <text x="22" y="101" font-size="14" fill="#59706a">Learn reusable</text><text x="22" y="121" font-size="14" fill="#59706a">response patterns</text>
    </g>
    <g transform="translate(274 126)">
      <rect width="190" height="150" rx="18" fill="#ffffff" stroke="#cbdad5"/>
      <circle cx="28" cy="28" r="15" fill="#dcfce7"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">2</text>
      <text x="22" y="72" font-size="19" font-weight="700" fill="#13211d">Sentinels</text>
      <text x="22" y="101" font-size="14" fill="#59706a">Cover subjects or</text><text x="22" y="121" font-size="14" fill="#59706a">repositories first</text>
    </g>
    <g transform="translate(506 126)">
      <rect width="190" height="150" rx="18" fill="#ffffff" stroke="#cbdad5"/>
      <circle cx="28" cy="28" r="15" fill="#fef3c7"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#a16207">3</text>
      <text x="22" y="72" font-size="19" font-weight="700" fill="#13211d">Adaptive batch</text>
      <text x="22" y="101" font-size="14" fill="#59706a">Spend where the</text><text x="22" y="121" font-size="14" fill="#59706a">ranking may change</text>
    </g>
    <g transform="translate(738 126)">
      <rect width="190" height="150" rx="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="28" cy="28" r="15" fill="#dbeafe"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">4</text>
      <text x="22" y="72" font-size="19" font-weight="700" fill="#13211d">Random audit</text>
      <text x="22" y="101" font-size="14" fill="#59706a">Log probabilities;</text><text x="22" y="121" font-size="14" fill="#59706a">correct prediction</text>
    </g>
    <g transform="translate(970 126)">
      <rect width="190" height="150" rx="18" fill="#0f766e" stroke="#0f766e"/>
      <circle cx="28" cy="28" r="15" fill="#ccfbf1"/><text x="28" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">5</text>
      <text x="22" y="72" font-size="19" font-weight="700" fill="#ffffff">Rank + resolve</text>
      <text x="22" y="101" font-size="14" fill="#ccfbf1">Paired gaps and</text><text x="22" y="121" font-size="14" fill="#ccfbf1">confidence tiers</text>
    </g>
  </g>
  <g stroke="#59706a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="238" y1="201" x2="266" y2="201"/><line x1="470" y1="201" x2="498" y2="201"/>
    <line x1="702" y1="201" x2="730" y2="201"/><line x1="934" y1="201" x2="962" y2="201"/>
  </g>
  <text x="600" y="323" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#0f766e">Prediction focuses the spend · randomization protects the conclusion</text>
</svg>
