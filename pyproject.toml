[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "irt-rank"
version = "0.1.0"
description = "Cost-aware adaptive IRT policies for ranking language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IRT Rank contributors" }]
dependencies = [
  "numpy>=1.26,<2.5",
  "pyarrow>=15",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/irt_rank"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
